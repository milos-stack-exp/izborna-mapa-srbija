<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIRN: Monitor izbornih nepravilnosti</title>
    
    <!-- Leaflet - Besplatna biblioteka za mape -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- MarkerCluster - Grupisanje tačaka -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; background: #f0f0f0; }
        .popup-card { font-family: sans-serif; line-height: 1.5; padding: 5px; }
        .source-tag { background: #d32f2f; color: white; padding: 2px 5px; font-size: 10px; font-weight: bold; border-radius: 3px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // Inicijalizacija mape na centar Srbije
        var map = L.map('map').setView([44.0165, 21.0059], 7);

        // KORISTIMO OPENSTREETMAP - NE TRAŽI API KLJUČ
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var markers = L.markerClusterGroup();

        // Učitavanje podataka
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                if (data.length === 0) {
                    console.log("Nema podataka u data.json");
                }
                data.forEach(item => {
                    var marker = L.marker([item.lat, item.lng]);
                    marker.bindPopup(`
                        <div class="popup-card">
                            <span class="source-tag">${item.source}</span>
                            <h3 style="margin: 5px 0;">${item.city}</h3>
                            <p style="margin: 5px 0; font-size: 13px;">${item.title}</p>
                            <a href="${item.link}" target="_blank" style="font-weight: bold; color: blue;">Pročitaj vest</a>
                        </div>
                    `);
                    markers.addLayer(marker);
                });
                map.addLayer(markers);
            })
            .catch(err => console.error('Greška pri učitavanju:', err));
    </script>
</body>
</html>
