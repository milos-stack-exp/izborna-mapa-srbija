name: Dnevno Azuriranje Mape

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write  # Eksplicitno dajemo dozvolu za pisanje

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzimanje koda
        uses: actions/checkout@v4 # Novija verzija

      - name: Podešavanje Python-a
        uses: actions/setup-python@v5 # Novija verzija
        with:
          python-version: '3.9'

      - name: Instalacija dodataka
        run: pip install feedparser

      - name: Pokretanje robota
        run: python scraper.py

      - name: Čuvanje novih podataka
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Automatsko osvežavanje mape" || echo "Nema novih vesti za dodavanje"
          git push
